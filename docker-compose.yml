version: "3.9"

services:
  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - bot-net

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - whatsapp_auth:/app/auth_state
    depends_on:
      - redis
    networks:
      - bot-net

volumes:
  whatsapp_auth:

networks:
  bot-net:
    name: bot-net
    external: true
